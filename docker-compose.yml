# Dharma AI — full local stack.
#
#   cp .env.example .env      # then set OPENAI_API_KEY
#   docker compose up --build
#
#   frontend  http://localhost:3000
#   backend   http://localhost:8000/docs
#   qdrant    http://localhost:6333/dashboard
#
# Works with no OpenAI key too: the backend detects the absence of a usable key
# and runs in demo mode (deterministic agent output, local embeddings), so the
# whole flow is still demonstrable.

services:
  postgres:
    image: postgres:16-alpine
    container_name: dharma-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dharma}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dharma}
      POSTGRES_DB: ${POSTGRES_DB:-dharma}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dharma} -d ${POSTGRES_DB:-dharma}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  qdrant:
    image: qdrant/qdrant:v1.12.4
    container_name: dharma-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"   # REST + dashboard
      - "6334:6334"   # gRPC
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      QDRANT__SERVICE__ENABLE_CORS: "true"
      QDRANT__LOG_LEVEL: INFO
    healthcheck:
      # The qdrant image is distroless — no curl/wget — so probe from the TCP
      # stack via bash, which is what it does ship.
      test: ["CMD-SHELL", "timeout 3 bash -c '</dev/tcp/localhost/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dharma-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
    environment:
      # Container-internal hostnames override whatever localhost values are in .env.
      DATABASE_URL: postgresql://${POSTGRES_USER:-dharma}:${POSTGRES_PASSWORD:-dharma}@postgres:5432/${POSTGRES_DB:-dharma}
      QDRANT_URL: http://qdrant:6333
      QDRANT_API_KEY: ${QDRANT_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o}
      OPENAI_EMBED_MODEL: ${OPENAI_EMBED_MODEL:-text-embedding-3-small}
      DHARMA_DEMO_MODE: ${DHARMA_DEMO_MODE:-false}
      BACKEND_CORS_ORIGINS: http://localhost:3000,http://frontend:3000
      RISK_HIGH_THRESHOLD: ${RISK_HIGH_THRESHOLD:-70}
      RISK_MEDIUM_THRESHOLD: ${RISK_MEDIUM_THRESHOLD:-40}
      NEGOTIATION_MAX_ROUNDS: ${NEGOTIATION_MAX_ROUNDS:-4}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - backend_storage:/app/storage

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Baked in at build time: NEXT_PUBLIC_* is inlined into the client bundle,
        # so it must be the URL the *browser* can reach, not the container name.
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
    container_name: dharma-frontend
    restart: unless-stopped
    depends_on:
      # Postgres must be *healthy*, not merely started: this container runs
      # `prisma db push` on boot to create the NextAuth tables.
      postgres:
        condition: service_healthy
      backend:
        condition: service_started
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-dharma}:${POSTGRES_PASSWORD:-dharma}@postgres:5432/${POSTGRES_DB:-dharma}
      # Server-side calls go container-to-container.
      API_INTERNAL_URL: http://backend:8000
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-dharma-dev-secret-change-me-in-production}
      DEMO_ADMIN_EMAIL: ${DEMO_ADMIN_EMAIL:-admin@dharma.ai}
      DEMO_ADMIN_PASSWORD: ${DEMO_ADMIN_PASSWORD:-admin123}
      DEMO_REVIEWER_EMAIL: ${DEMO_REVIEWER_EMAIL:-reviewer@dharma.ai}
      DEMO_REVIEWER_PASSWORD: ${DEMO_REVIEWER_PASSWORD:-reviewer123}
      DEMO_USER_EMAIL: ${DEMO_USER_EMAIL:-user@dharma.ai}
      DEMO_USER_PASSWORD: ${DEMO_USER_PASSWORD:-user123}
    ports:
      - "3000:3000"

volumes:
  postgres_data:
  qdrant_data:
  backend_storage:
