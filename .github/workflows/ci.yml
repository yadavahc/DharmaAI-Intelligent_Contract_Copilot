name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# A new push to the same branch cancels the previous run — no point burning
# minutes on a commit that has already been superseded.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Every job runs with deterministic agent output: no OpenAI key, no spend, no
  # rate-limit flakes. The agents still execute through genuine Lyzr Task objects,
  # so this exercises the real orchestration.
  DHARMA_DEMO_MODE: "true"

jobs:
  # ───────────────────────────────────────────────────────────────────────────
  backend:
    name: Backend · tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # 3.11 satisfies lyzr-automata's declared Requires-Python (<3.12)
          # natively, so the genuine SDK installs with no version override.
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # --no-deps keeps lyzr-automata's openai==1.3.4 pin from downgrading the
          # modern SDK. See backend/requirements-lyzr.txt for the full rationale.
          pip install --no-deps -r requirements-lyzr.txt

      - name: Assert the genuine Lyzr SDK is importable
        working-directory: backend
        run: |
          python - <<'PY'
          from importlib.metadata import version
          from app.agents.lyzr_compat import runtime_info

          info = runtime_info()
          print(f"lyzr-automata {version('lyzr-automata')}")
          for key, value in info.items():
              print(f"  {key}: {value}")

          # CI must fail loudly rather than silently green-lighting the fallback
          # shim — the whole multi-agent claim rests on this.
          assert info["is_genuine_sdk"], f"Lyzr SDK not live: {info['import_error']}"
          PY

      - name: Run unit tests
        working-directory: backend
        run: pytest -q

  # ───────────────────────────────────────────────────────────────────────────
  frontend:
    name: Frontend · typecheck & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Generate Prisma client
        working-directory: frontend
        # `generate` never connects; a placeholder URL is enough.
        env:
          DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder
        run: npx prisma generate

      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck

      - name: Lint
        working-directory: frontend
        # Advisory: a lint warning should not block a hackathon build, but the
        # output is still worth having in the log.
        continue-on-error: true
        run: npm run lint

      - name: Production build
        working-directory: frontend
        env:
          DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder
          NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
        run: npm run build

  # ───────────────────────────────────────────────────────────────────────────
  e2e:
    name: E2E · upload → classify → negotiate → escalate
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: dharma
          POSTGRES_PASSWORD: dharma
          POSTGRES_DB: dharma
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U dharma -d dharma"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      qdrant:
        image: qdrant/qdrant:v1.12.4
        ports: ["6333:6333"]
        # No healthcheck: the qdrant image is distroless and ships no shell, so
        # the readiness probe runs from the runner instead (see below).

    env:
      DATABASE_URL: postgresql://dharma:dharma@localhost:5432/dharma
      QDRANT_URL: http://localhost:6333
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: ci-only-secret-not-used-outside-this-job
      API_INTERNAL_URL: http://127.0.0.1:8000
      NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:8000

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Wait for Qdrant
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:6333/healthz >/dev/null 2>&1; then
              echo "Qdrant ready"; exit 0
            fi
            sleep 2
          done
          echo "Qdrant did not become ready in 60s"; exit 1

      - name: Install backend
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install --no-deps -r requirements-lyzr.txt

      - name: Start backend
        working-directory: backend
        run: |
          nohup uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/backend.log 2>&1 &
          for i in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:8000/api/health >/dev/null 2>&1; then
              echo "Backend ready"
              curl -s http://127.0.0.1:8000/api/health | python -m json.tool | head -30
              exit 0
            fi
            sleep 2
          done
          echo "Backend failed to start:"; cat /tmp/backend.log; exit 1

      - name: Install frontend
        working-directory: frontend
        run: npm ci

      - name: Prepare database and build
        working-directory: frontend
        env:
          # Prisma manages only the `auth` schema. Sharing `public` with the
          # backend made db push try to drop the dharma_* tables it had just
          # created and seeded.
          DATABASE_URL: postgresql://dharma:dharma@localhost:5432/dharma?schema=auth
        run: |
          npx prisma db push --skip-generate
          npm run build

      - name: Install Playwright browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run Playwright suite
        working-directory: frontend
        run: npx playwright test

      - name: Backend log on failure
        if: failure()
        run: tail -100 /tmp/backend.log

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7

  # ───────────────────────────────────────────────────────────────────────────
  docker:
    name: Docker · images build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Validate compose file
        run: docker compose config --quiet

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          load: true
          tags: dharma-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
          load: true
          tags: dharma-frontend:ci
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=http://localhost:8000
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify the image ships the genuine Lyzr SDK
        run: |
          docker run --rm dharma-backend:ci python -c "
          from importlib.metadata import version
          from app.agents.lyzr_compat import runtime_info
          info = runtime_info()
          print('lyzr-automata', version('lyzr-automata'), '->', info['lyzr_runtime'])
          assert info['is_genuine_sdk'], 'image fell back to the shim'
          "

  # ───────────────────────────────────────────────────────────────────────────
  security:
    name: Security · secrets & dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # gitleaks needs full history to scan every commit

      - name: Scan history for committed secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Narrow allowlist for the synthetic secrets that the scrubber tests
          # must contain in order to assert they get redacted. Scoped to that one
          # file so a real leak elsewhere is still caught.
          GITLEAKS_CONFIG: .gitleaks.toml

      - name: Assert no env files are tracked
        run: |
          # Belt and braces alongside .gitignore: a tracked .env would leak real
          # credentials into a public repository.
          if git ls-files | grep -E '(^|/)\.env$|(^|/)\.env\.local$'; then
            echo "::error::An environment file is tracked by git"
            exit 1
          fi
          echo "No environment files tracked"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: npm audit (production dependencies)
        working-directory: frontend
        # Advisory. Dev-tooling advisories and downgrade-style "fixes" should not
        # block a build; production criticals are what matter and are checked below.
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: pip-audit
        continue-on-error: true
        run: |
          pip install pip-audit
          pip-audit -r backend/requirements.txt --ignore-vuln GHSA-4xh5-x5gv-qwph || true
